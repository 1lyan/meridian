name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm test
      - run: pnpm test:integration

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/bootstrap validate
      - run: terraform -chdir=infra/terraform/dev init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/dev validate
      - run: terraform fmt -check -recursive infra/terraform
