name: nightly-eval

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meridian/agent test
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ vars.BEDROCK_MODEL_ID != '' && vars.AWS_NIGHTLY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ vars.AWS_NIGHTLY_ROLE_ARN }}
          aws-region: us-east-1
      - run: pnpm --filter @meridian/agent eval:nightly
        env:
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          AWS_REGION: us-east-1
          MODEL_MAX_TOKENS: "256"
